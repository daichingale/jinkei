<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>陣形エディタ</title>
<style>
:root{--bg:#14161a;--panel:#1c1f25;--panel2:#23272f;--line:#2e333c;--fg:#e8e9ec;--mut:#99a0ab;--acc:#ffd23f;--bad:#ff6b6b;--ok:#6fdc8c;--blue:#5b8def}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#556}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.ghost{background:none;border-color:transparent;color:var(--mut);padding:2px 6px}
button.ghost:hover{color:var(--fg);border-color:var(--line)}
button[disabled]{opacity:.35;cursor:default}
input,select,textarea{background:#12141a;border:1px solid var(--line);border-radius:5px;padding:3px 6px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
input.num{width:64px}
label.f{display:flex;flex-direction:column;gap:2px;color:var(--mut);font-size:11px}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0 6px 0 0;white-space:nowrap}
#fname{color:var(--mut)}
#status{font-size:12px;padding:2px 8px;border-radius:10px;background:#2a2e36;white-space:nowrap}
#status:empty{display:none}
#status.err{background:#3a1f22;color:var(--bad)}
#status.dirty{color:var(--acc)}
.sp{flex:1}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
#right{background:var(--panel);overflow:auto;min-height:0;border-left:1px solid var(--line);display:flex;flex-direction:column}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px;color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.05em}
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#canvaswrap{flex:1;position:relative;min-height:0}
#svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);touch-action:none;user-select:none;-webkit-user-select:none}
#svg.drawing{cursor:crosshair}
#cbar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--mut)}
#cbar label{display:flex;align-items:center;gap:4px;white-space:nowrap}
#info{flex:1;color:var(--fg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:none;border-radius:0;background:none;padding:8px 2px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--blue)}
.tabs .tsep{display:flex;align-items:center;padding:0 6px 0 8px;margin-left:4px;border-left:1px solid var(--line);color:#6b7280;font-size:10px;letter-spacing:.08em}
.tabs button.adv{flex:0 0 auto;padding:8px 10px}
.pane{display:none;padding:10px;flex:1;min-height:0}
.pane.on{display:block}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.card.sel{border-color:var(--acc)}
.card.errc{border-color:var(--bad)}
.card.attr{border-style:dashed}
.card .top{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.card .top select{flex:0 0 auto}
.card .top .cnt{flex:1;color:var(--mut);font-size:11px}
.card .top input.grp{flex:1;font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);cursor:pointer;color:var(--mut)}
.chip.on{color:#111;border-color:transparent}
.sum{background:#1a1d23;border-radius:6px;padding:5px 8px;margin-bottom:6px;font-size:12px;line-height:1.55}
.sum .k{color:var(--mut);margin-right:4px}
.sum .mut{color:var(--mut)}
.params{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.params label.f input{width:100%}
.params .pt{grid-column:span 2;display:flex;gap:4px;align-items:flex-end}
.params .pt label.f{flex:1}
.xfc{display:flex;gap:6px;align-items:center;margin-bottom:4px;font-size:12px;background:#2b3140;border-radius:12px;padding:2px 4px 2px 10px}
.xfc .xl{flex:1}
.xfc .stp{display:flex;gap:2px}
.xfc .stp button{padding:0 7px;min-width:24px;line-height:20px;border-radius:10px}
.xfadd{display:flex;gap:4px;margin-bottom:6px}
.opts{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.note{color:#7f8794;font-size:11px;margin-bottom:4px}
table.t{width:100%;border-collapse:collapse}
table.t td,table.t th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--mut);font-weight:500;font-size:11px}
table.t input{width:100%}
.pcard{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px;background:#1a1d23}
.pcard textarea.score{width:100%;min-height:96px;margin-top:6px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical;white-space:pre;tab-size:2}
.tokpal{display:flex;flex-direction:column;gap:3px;margin-top:6px}.tokpal .pg{display:flex;flex-wrap:wrap;align-items:center;gap:3px}.tokpal i{font-style:normal;color:var(--mu,#8a93a0);font-size:11px;width:44px;flex:none;white-space:nowrap}.tokpal button{padding:2px 8px;min-width:26px;height:24px;white-space:nowrap;font:12px ui-monospace,Menlo,Consolas,monospace}
.pstaff{overflow-x:auto;background:#101216;border-radius:6px;margin-top:6px}
.perr{color:#ffb3b3;font-size:12px;margin-top:4px;white-space:pre-wrap}
#code{width:100%;height:calc(100vh - 190px);font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:none;white-space:pre;tab-size:2}
#codeerr{color:var(--bad);font-size:12px;min-height:18px;margin-bottom:6px}
.warn{font-size:12px;padding:5px 7px;border-radius:5px;margin-bottom:4px;background:#2a1f22;cursor:pointer;border-left:3px solid var(--bad)}
.warn:hover{background:#3a2629}
.warn b{color:var(--bad);margin-right:4px}
#errbanner{position:absolute;left:60px;right:12px;top:10px;background:#3a1f22ee;color:#ffb3b3;border:1px solid var(--bad);border-radius:6px;padding:6px 10px;display:none;z-index:3;font-size:12px}
#vprog{width:120px;display:none}
.ind td input{width:64px}
.indrow{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:5px;font-size:12px;cursor:pointer}
.indrow.on{background:#26324a}
.indrow b{min-width:34px}
.indrow .d{flex:1;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--mut);font-size:11px;line-height:1.6}
kbd{background:#2a2e36;border-radius:3px;padding:0 4px;font-size:11px}
details.adv{margin:6px 0 0;border-top:1px solid var(--line);padding-top:4px}
details.adv>summary{cursor:pointer;color:var(--mut);font-size:12px;padding:2px 0;list-style:none;display:flex;gap:6px;align-items:center}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"▸";font-size:10px;width:10px}
details.adv[open]>summary::before{content:"▾"}
details.adv>summary .dsum{margin-left:auto;color:#7f8794;font-size:11px}
details.adv>div{padding:6px 0 2px}
/* 動き（スライダ） */
.mrow{display:grid;grid-template-columns:62px 1fr 78px 40px;gap:6px;align-items:center;margin-bottom:2px;font-size:12px}
.mrow .ml{color:var(--mut)}
.mrow input[type=range]{width:100%;padding:0;background:none;border:none;accent-color:var(--blue)}
.mrow output{color:var(--fg);font-size:12px;text-align:right;white-space:nowrap}
.mrow button{padding:0 4px;font-size:11px}
.mviz{display:flex;gap:10px;align-items:center;margin:4px 0 6px;font-size:11px;color:var(--mut)}
.mviz svg{display:block}
/* 向き・姿勢 */
.compass{display:grid;grid-template-columns:repeat(3,30px);grid-auto-rows:30px;gap:3px}
.compass button{padding:0;font-size:15px;line-height:1;border-radius:7px}
.compass button.on,.pal button.on,.seg button.on,.fxx button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.compass .mid{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:10px}
.fxrow{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.fxx{display:flex;flex-direction:column;gap:3px}
.fxx button{padding:1px 8px;font-size:11px;text-align:left}
.fxl{font-size:11px;color:var(--mut);margin:0 0 3px}
.pal{display:grid;grid-template-columns:repeat(5,52px);gap:3px}
.pal button{display:flex;flex-direction:column;align-items:center;gap:0;padding:2px 0 1px;font-size:10px;line-height:1.2;border-radius:7px}
.pal svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.seg button{padding:2px 8px;font-size:11px;border-radius:12px}
.segl{font-size:11px;color:var(--mut);margin:4px 0 2px}
/* キャンバス上のUI */
#tools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:3px;background:#1c1f25ee;border:1px solid var(--line);border-radius:9px;padding:4px;z-index:3;box-shadow:0 2px 10px #0006}
#tools button{width:34px;height:34px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.05;border-radius:6px;position:relative}
#tools button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools button .kb{position:absolute;right:2px;bottom:0;font-size:8px;color:#7f8794}
#tools button.on{background:var(--blue);border-color:var(--blue);color:#fff}
#tools button.on .kb{color:#dbe6ff}
#glabel{position:absolute;display:none;background:#000c;color:#fff;border-radius:5px;padding:2px 7px;font-size:12px;pointer-events:none;z-index:5;white-space:nowrap}
#selbar{position:absolute;left:56px;right:12px;bottom:10px;margin:0 auto;width:max-content;max-width:calc(100% - 68px);background:#1c1f25f0;border:1px solid var(--blue);border-radius:9px;padding:6px 8px;display:none;flex-direction:column;gap:5px;z-index:4;box-shadow:0 4px 18px #0008}
#selbar .r{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
#selbar .lbl{color:#cfe0ff;font-size:12px;margin-right:4px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#selbar .gl{color:var(--mut);font-size:11px}
#selbar .vs{width:1px;height:18px;background:var(--line);margin:0 2px}
#pop,#whopop,#ctx{position:absolute;display:none;background:#1c1f25;border:1px solid #3a4152;border-radius:9px;padding:8px;z-index:20;box-shadow:0 6px 24px #000a}
#ctx{position:fixed;min-width:170px;padding:4px}
#ctx .mi{display:block;width:100%;text-align:left;border:none;background:none;padding:5px 10px;border-radius:5px}
#ctx .mi:hover{background:#2b3140}
#ctx .mi[disabled]{opacity:.35}
#ctx .mh{color:var(--mut);font-size:11px;padding:3px 10px}
#ctx .ms{height:1px;background:var(--line);margin:3px 0}
#ctx .arr{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px;max-width:240px}
#ctx .pw{padding:4px 8px}
#whopop{min-width:220px}
#whopop .chips{margin-bottom:8px}
#whopop .chip{font-size:12px;padding:2px 9px}
/* タイムライン */
#timeline{border-top:1px solid var(--line);background:var(--panel);padding:4px 10px 6px}
#tlbar{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;color:var(--mut)}
#tlbar .vs{width:1px;height:16px;background:var(--line);margin:0 2px}
#tltime{color:var(--fg);min-width:150px}
#tltrack{position:relative;height:52px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#tlruler{position:absolute;left:0;right:0;top:0;height:16px;cursor:col-resize;background:#16181d;border-radius:4px}
#tlruler .tk{position:absolute;top:2px;font-size:9px;color:#6b7280;border-left:1px solid #444b57;padding-left:2px;height:12px;line-height:12px;pointer-events:none}
#playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--acc);pointer-events:none;z-index:3}
#playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid var(--acc);border-bottom:0}
.tlb{position:absolute;top:19px;height:32px;border-radius:5px;background:#2b3140;border:1px solid #3a4152;overflow:hidden;cursor:pointer;padding:1px 6px 0;font-size:11px;line-height:1.3;white-space:nowrap}
.tlb.cur{border-color:var(--blue);background:#26324a}
.tlb b{font-size:12px}
.tlb .m{color:var(--mut);font-size:10px}
.tlb .w{color:var(--bad);font-size:10px;margin-left:3px}
.tlb .hold{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ffffff2e 0 3px,transparent 3px 6px);pointer-events:none}
.tlb .edge{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.tlb .edge:hover{background:#5b8def99}
/* モーダル */
#modalbg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:100}
#modal{background:var(--panel);border:1px solid #3a4152;border-radius:10px;padding:16px 18px;min-width:300px;max-width:460px;box-shadow:0 10px 40px #000c}
#modal .mt{font-weight:600;margin-bottom:8px}
#modal .mb{color:var(--fg);white-space:pre-wrap;margin-bottom:14px}
#modal .mbt{display:flex;gap:8px;justify-content:flex-end}
.projectstate[hidden]{display:none}
.projectstate{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--mut);font-size:11px}
.project-dialog{width:min(460px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:16px}
.project-dialog::backdrop{background:#0009}
.project-dialog h2{font-size:16px;margin:0 0 12px}
.project-dialog h3{font-size:13px;margin:12px 0 6px}
.project-dialog label{display:grid;gap:4px;margin:8px 0}
.project-dialog input,.project-dialog textarea{width:100%;padding:6px}
.project-dialog textarea{min-height:62px;resize:vertical}
.project-dialog output{display:block;margin-top:6px;color:var(--acc)}
.project-dialog footer{display:flex;justify-content:flex-end;margin-top:12px}
.project-dialog li{margin:6px 0;overflow-wrap:anywhere}
.project-dialog li button{white-space:normal;text-align:left}
.project-actions{display:flex;gap:6px;flex-wrap:wrap}
#localbtns{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:760px){
  html,body{height:100dvh}
  header{gap:5px;padding:6px 8px;flex-wrap:wrap;flex:0 0 auto}
  header h1{font-size:13px}
  main{display:flex;flex-direction:column;overflow:auto;overscroll-behavior:contain}
  #center{flex:0 0 62dvh;min-height:390px}
  #right{flex:0 0 auto;min-height:44dvh;border-left:0;border-top:1px solid var(--line);overflow:visible}
  .tabs{overflow-x:auto;flex-wrap:nowrap}
  .tabs button{flex:0 0 auto;min-width:48px;font-size:11px}
  #tlbar,#cbar{flex-wrap:wrap;gap:4px}
  #tltrack{min-height:52px}
  #code{height:40dvh}
  .pane{min-height:200px}
  .params{grid-template-columns:repeat(2,minmax(0,1fr))}
  #selbar{max-height:50%;overflow-y:auto}
}
/* __UX_CSS_BEGIN__ */
__UX_CSS__
</style></head><body>
<header>
  <h1>陣形エディタ</h1><span id="fname"></span><span id="status">読み込み中</span>
  <div class="modesw" id="modesw" role="group" aria-label="操作モード"><button type="button" data-mode="easy" title="むずかしい項目をかくして、やることを案内します">かんたん</button><button type="button" data-mode="pro" title="すべての機能（コード・数値入力など）を表示します">詳細</button></div>
  <span class="projectstate" id="projectstate" hidden><span id="draftstatus" role="status"></span><span id="syncstatus" role="status"></span></span>
  <span class="sp"></span>
  <span id="localbtns" style="display:none"><button id="open" title="手元の .jk ファイルを開く（ページへのドラッグ＆ドロップでも可）">開く</button><button id="newfile" title="ひな形から新しく作る">新規</button><button id="drafthistory">下書き履歴</button><button id="projectsync">端末間同期</button><input type="file" id="openfile" accept=".jk,text/plain" style="display:none"></span>
  <button id="homebtn" title="はじめに（かんたん作成・サンプル・ファイルを開く）">はじめに</button><button id="helpbtn" title="使い方ガイドと用語集"><span class="q">?</span>ヘルプ</button><button id="scpalbtn" class="scbtn" title="コマンド検索 (Ctrl+K)" aria-label="コマンド検索"></button><button id="scbtn" class="scbtn" title="ショートカット一覧 (?)" aria-label="ショートカット一覧"></button>
  <button id="undo" title="元に戻す (Ctrl+Z)">↶</button><button id="redo" title="やり直す (Ctrl+Shift+Z)">↷</button>
  <button id="preview" title="2D/3Dプレビューを新しいタブで開く">プレビュー</button>
  <select id="vcam" title="動画のカメラ"><option value="audience">客席から</option><option value="orbit">回り込み</option><option value="top">真上</option><option value="low">目線</option></select>
  <button id="video">3D動画を書き出す</button><progress id="vprog" max="1" value="0"></progress>
  <button id="save" class="pri" title="Ctrl+S">保存</button>
</header>
<main>
  <div id="center">
    <div id="canvaswrap"><div id="errbanner"></div><svg id="svg"></svg><div id="sides" aria-hidden="true"><span class="l">← 下手</span><span class="r">上手 →</span><span class="b">▼ 客席</span></div>
      <div id="zoomctl"><button id="zin" title="拡大（2本指でつまんでも拡大できます）" aria-label="拡大">＋</button><button id="zout" title="縮小" aria-label="縮小">−</button><button id="zfit" title="全体を表示" aria-label="全体を表示">⤢</button></div>
      <div id="tools"></div>
      <div id="glabel"></div>
      <div id="selbar">
        <div class="r"><span class="lbl" id="selinfo"></span>
          <span class="vs"></span><span class="gl">向き・姿勢</span><button id="selface" title="選んだ人の向きを決める">向き ▾</button><button id="selpose" title="選んだ人の姿勢を決める">姿勢 ▾</button><button id="selcarry" title="選んだ人の楽器の構え（演奏・右手・左手・正面・斜め）を決める">構え ▾</button><button id="selstep" title="選んだ人の歩き方（グライド・バックなど）を決める">ステップ ▾</button><button id="selaction" title="選んだ人の動作（スピン・トスなど。カラーガード向け）を決める">動作 ▾</button>
          <span class="vs"></span><button id="flipx" title="選んだ人を左右に反転（上手と下手を入れ替え）">↔ 左右反転</button><button id="flipy" title="選んだ人を前後に反転（客席側と奥を入れ替え）">↕ 前後反転</button>
          <span class="vs scvs"></span><button id="seladd" title="選んだ人と同じパートに1人追加">＋ 人を追加</button><button id="seldup" title="選んだ人を複製">複製</button><button id="seldel" class="dangerbtn" title="選んだ人を削除">削除</button>
          <button id="selclear" class="ghost" title="選択を解除 (Esc)">✕</button></div>
        <div class="r"><span class="gl">並べる</span>
          <button data-arr="line" title="選んだ人を直線に等間隔で並べる">直線</button><button data-arr="curve" title="なめらかな曲線に並べる">曲線</button><button data-arr="arc" title="弧に並べる">弧</button><button data-arr="circle" title="円に並べる">円</button><button data-arr="block" title="ブロック（四角い隊列）に並べる">ブロック</button><button id="mkfollow" title="選んだ人を、先頭の通った道を順にたどる列にする">フォロー</button>
          <span class="vs"></span><button id="unpin" title="個別に動かした位置を取り消して、元の隊形の位置に戻す">個別の位置を解除</button></div>
      </div>
      <div id="pop"></div><div id="whopop"></div>
    </div>
    <div id="nextbar" role="status" aria-live="polite"></div>

// ================= サーバとのやりとり =================
async function compile(source, adopt) {

  catch (e) { setStatus('エンジンに接続できません（jinkei edit を起動してください）', 'err'); return; }
  if (id !== reqId) return;

let pending = null, timer = null, codeTimer = null;

}
// 属性だけの文（pose/face…）は、同じセットの位置を決める文より後ろに置かないと無視されるので、最後にまとめる
function normalizeAttrs() {

}

// ================= 会場の言葉（ドットシートと同じ言い方） =================
const F = () => R.data.field;

const DOT = () => isFB() ? 0.95 : 0.34;
const HND = () => isFB() ? 1.3 : 0.45;
const unitLen = v => isFB() ? `${fmt1(v)}歩` : `${fmt1(v)}m`;
function dX(x) {
  const f = F();
  if (f.type === 'football') {
    if (Math.abs(x) < 0.05) return '50ydライン上';
    const side = x < 0 ? 'サイド1' : 'サイド2', ax = Math.abs(x), kk = Math.min(10, Math.round(ax / 8)), yl = 50 - 5 * kk;
    const line = yl <= 0 ? 'ゴールライン' : `${yl}ydライン`, off = ax - 8 * kk;
    return Math.abs(off) < 0.05 ? `${side} ${line}上` : `${side} ${line}から${off > 0 ? '外' : '内'}へ${fmt1(Math.abs(off))}歩`;
  }
  if (Math.abs(x) < 0.05) return 'センター';
  if (f.type === 'stage' && Math.abs(x) > f.w / 2 + 1e-9) return `${x < 0 ? '下手' : '上手'}袖（センターから${fmt1(Math.abs(x))}m）`;
  return `${x < 0 ? '下手' : '上手'} ${fmt1(Math.abs(x))}m`;
}
function dY(y) {
  const f = F();
  if (f.type === 'football') {
    const refs = [[0, 'フロントサイドライン'], [f.hash, 'フロントハッシュ'], [f.bsl - f.hash, 'バックハッシュ'], [f.bsl, 'バックサイドライン']];
    const [r, name] = refs.reduce((a, b) => Math.abs(y - b[0]) < Math.abs(y - a[0]) ? b : a), off = y - r;
    return Math.abs(off) < 0.05 ? `${name}上` : `${name}から${off > 0 ? '後ろ' : '前'}へ${fmt1(Math.abs(off))}歩`;
  }
  if (f.type === 'floor') return `客席側の端から奥へ${fmt1(y)}m`;
  if (f.type === 'stage') return Math.abs(y) < 0.05 ? '舞台前端' : `舞台前端から奥へ${fmt1(y)}m`;
  if (Math.abs(y) < 0.05) return 'センターライン上';

}
const dPt = p => dX(p[0]) + '・' + dY(p[1]);
const faceNames = {front: '客席', back: '奥', kami: '上手', shimo: '下手', center: '中心へ', out: '外へ', travel: '進行方向'};

}
const POSES = [['attention', '気をつけ', '気'], ['rest', '休め', '休'], ['wide', '足開き', '開'], ['cross', 'クロス', '交'], ['kneel', '片膝', '片'], ['kneel2', '膝つき', '膝'], ['lunge', 'ランジ', 'ラ'], ['crouch', 'しゃがみ', 'し'], ['toe', 'つま先', '先']];
const CARRIES = [['play', '演奏'], ['right', '右手'], ['left', '左手'], ['front', '正面'], ['diag', '斜め']];

// ハンドル（ドラッグで隊形を編集）

let fixNotes = [];
function renderWarns() {
  if (window.uxRenderWarns) { uxRenderWarns(); return; }
  const D = R.data, nc = D.warnings.filter(w => w.kind === '衝突').length;
  $('pwarn').innerHTML = (nc ? `<div class="row"><button id="autofix" class="pri" title="時間差（wait）・早着き（in）・カーブ（bend）を総当たりで試して、衝突が最も減る直し方を入れます（Ctrl+Z で戻せます）">衝突を自動で直す</button></div>` : '') +
    (fixNotes.length ? `<div class="card" style="border-color:var(--ok)"><div class="note" style="color:var(--ok);font-weight:600">自動で直しました</div>${fixNotes.map(n => `<div class="note">・${esc(n)}</div>`).join('')}</div>` : '') +
    (D.warnings.length ? D.warnings.map((w, j) => `<div class="warn" data-j="${j}"><b>${w.kind}</b>${esc(w.msg)}</div>`).join('') : '<div style="color:var(--ok)">✓ 大股・衝突・場外はありません</div>');
  if ($('autofix')) $('autofix').onclick = autoFix;
  document.querySelectorAll('#pwarn .warn').forEach(d => d.onclick = () => { const w = D.warnings[+d.dataset.j]; stopPlay(); playT = null; curSet = w.set; curStmt = -1; refresh(true); $('info').textContent = w.msg; });
  const n = D.warnings.length;

}
async function autoFix() {
  const bt = $('autofix'); if (bt) { bt.disabled = true; bt.textContent = '探しています…'; }
  if (window.uxBusy) uxBusy(true);
  let r;
  try { r = await fetch('/api/fix', {method: 'POST', body: currentSource()}).then(r => r.json()); }
  catch (e) { r = {ok: false, error: '自動修正に失敗しました'}; }
  if (window.uxBusy) uxBusy(false);
  if (!r.ok) { notice(r.error); renderWarns(); return; }
  if (!r.notes.length) { fixNotes = ['自動で直せる組み合わせは見つかりませんでした。隊形や counts を見直してください。']; renderWarns(); if (window.uxToast) uxToast('自動では直せませんでした。カウントを増やすか、位置を動かしてみましょう', 'err', 4200); return; }
  pushUndo(currentSource());
  M = r.model;
  fixNotes = [...r.notes, `衝突 ${r.before}件 → ${r.after}件`];
  edited(true);
  renderPanels();
  if (window.uxToast) uxToast(r.after ? `ぶつかりを ${r.before}件 → ${r.after}件に減らしました` : `ぶつかりを自動で直しました（${r.before}件 → 0件）`, r.after ? 'info' : 'ok');
}

// 楽譜の絵とエラー表示だけを更新（入力欄は触らない）
// 5線（テナー・バス）は線の本数ぶん高く描く
function staffH(inst) { return inst === 'tenor' || inst === 'bass' ? 150 : 120; }
// 楽譜の入力パレット: 押すと選択中の入力欄のカーソル位置に記号を入れる
const PALETTE = [
  ['手', [['R', '右（強）'], ['L', '左（強）'], ['r', '右'], ['l', '左'], ['B', '両手（強）'], ['b', '両手'], ['-', '休符'], ['~', 'タイ'], ['|', '小節線']]],
  ['ドラム', [['1', 'ドラム1（テナー最高音・バス最小）'], ['2', 'ドラム2'], ['3', 'ドラム3'], ['4', 'ドラム4'], ['5', 'テナー=スポック1 / バス=最大'], ['6', 'テナー=スポック2'], ['[]', '和音: 手のあとに [135] のように番号を並べる']]],
  ['奏法', [['o', 'リムショット'], ['m', 'ミュート'], ['g', 'ゴック'], ['s', 'スクレイプ'], ['k', 'スティッククリック'], ['x', 'スティック'], ['f', 'フラム'], ['d', 'ダブル'], ['z', 'バズ'], ['^', '強いアクセント'], ['>', 'アクセント']]],
  ['強弱', [['pp', ''], ['p', ''], ['mp', ''], ['mf', ''], ['f', ''], ['ff', ''], ['cresc', 'だんだん強く'], ['dim', 'だんだん弱く']]],
];
function paletteHtml(i) {
  return `<div class="tokpal" data-pal="${i}">` + PALETTE.map(([g, bs]) => `<span class="pg"><i>${g}</i>${bs.map(([t, tip]) => `<button type="button" data-tok="${esc(t)}"${g === '強弱' ? ' data-dyn="1"' : ''}${tip ? ` title="${esc(tip)}"` : ''}>${esc(t)}</button>`).join('')}</span>`).join('') + `</div>`;
}
function insertToken(i, tok, dyn) {
  const ta = $('pscore').querySelector(`.pcard[data-pi="${i}"] textarea.score`); if (!ta) return;
  const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  // 前が文字のとき、記号が前の記号とくっつかないよう、単語（pp/cresc 等）の前後に空白を入れる
  const word = !!dyn; // 強弱は単語なので前後に空白（f は強弱とフラムで別物）
  let ins = tok;
  if (word) ins = (a > 0 && !/\s/.test(v[a - 1]) ? ' ' : '') + tok + ' ';
  else if (tok === '[]') ins = '[]';
  ta.value = v.slice(0, a) + ins + v.slice(b);
  const pos = tok === '[]' ? a + 1 : a + ins.length;
  ta.focus(); ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event('input', {bubbles: true}));
}
function updateScoreView() {
  if (!M || !$('pscore')) return;
  const D = R && R.data, ok = D && D.parts && D.parts.length === M.parts.length && !lastErr;
  // エラー行がどのパートの中か（src は今コンパイルしている文字列）
  const lines = src.split('\n'), starts = [];
  lines.forEach((l, n) => { if (/^\s*(part|パート)\s/.test(l)) starts.push(n + 1); });
  M.parts.forEach((p, i) => {
    const e = $('pscore').querySelector(`[data-perr="${i}"]`), st = $('pscore').querySelector(`[data-staff="${i}"]`);
    if (!e || !st) return;
    let msg = '';
    if (lastErr && lastErr.line && starts.length === M.parts.length) {
      let endL = lines.length;
      for (let n = starts[i]; n < lines.length; n++) if (/^  }\s*$/.test(lines[n])) { endL = n + 1; break; }
      if (lastErr.line >= starts[i] && lastErr.line <= endL) {
        const off = lastErr.line - starts[i] - (p.meter ? 1 : 0) - (p.start ? 1 : 0);
        msg = `${off >= 1 && lastErr.line < endL ? off + '行目 ' + Math.max(lastErr.col - 4, 1) + '列: ' : ''}${lastErr.msg}`;
      }
    }
    const warns = ok ? D.warnings.filter(w => w.kind === '拍子' && w.msg.startsWith(`パート「${p.name}」`)).map(w => w.msg) : [];
    e.textContent = [msg ? '⚠ ' + msg : '', ...warns.map(w => '△ ' + w)].filter(Boolean).join('\n');
    e.style.color = msg ? '' : '#ffd23f';
    const dp = D && D.parts && D.parts[i];
    if (dp && !(scorePlay && scorePlay.i === i)) {
      const len = Math.max(dp.end - dp.start, 1);
      const inst = jkStaff.instOf(D, dp);
      st.innerHTML = dp.notes.length ? jkStaff(dp, dp.start, dp.end, Math.ceil(80 + len * 60), staffH(inst), null, {inst}) : '';
    }
    st.style.opacity = ok ? '' : '0.45';
  });
}
function playPart(i, btn) {
  const was = scorePlay && scorePlay.i === i;
  stopScore(); stopPlay();
  if (was) { updateScoreView(); return; }
  const D = R && R.data; if (!D || lastErr || !D.parts || !D.parts[i]) return;
  const p = D.parts[i], D2 = Object.assign({}, D, {parts: [p]}), inst = jkStaff.instOf(D, p);
  if (!jkAudio.play(D2, p.start)) return;
  btn.classList.add('on'); btn.textContent = '■ 停止';
  const st = $('pscore').querySelector(`[data-staff="${i}"]`), t0 = performance.now(), s0 = jkAudio.secAt(D2, p.start);
  const len = Math.max(p.end - p.start, 1), W = Math.ceil(80 + len * 60);
  scorePlay = {i, raf: 0};
  const step = () => {
    if (!scorePlay || scorePlay.i !== i) return;
    const c = jkAudio.countAt(D2, s0 + (performance.now() - t0) / 1000);
    if (c > p.end + 1 || !jkAudio.playing) { stopScore(); updateScoreView(); return; }
    st.innerHTML = jkStaff(p, p.start, p.end, W, staffH(inst), c, {inst});
    const x = 70 + (c - p.start) / len * (W - 80);
    if (x > st.scrollLeft + st.clientWidth - 40 || x < st.scrollLeft) st.scrollLeft = Math.max(0, x - 60);
    scorePlay.raf = requestAnimationFrame(step);
  };
  scorePlay.raf = requestAnimationFrame(step);
}
// MusicXML（.musicxml / .xml / .mxl）の1パートを譜面に取り込む。i = -1 なら新しいパート
function importXml(i) {
  const f = $('xmlfile'); f.value = '';
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try {
      const text = /\.mxl$/i.test(file.name) ? await jkUnpackMxl(await file.arrayBuffer()) : await file.text();
      let r = jkImportMusicXml(text);
      if (r.parts.length > 1) {
        const pick = await modal('MusicXML の読み込み', 'どのパートを読み込みますか？', [{label: 'やめる', value: -1}, ...r.parts.map((n, k) => ({label: n, value: k, cls: k === 0 ? 'pri' : ''}))]);
        if (typeof pick !== 'number' || pick < 0) return;
        r = jkImportMusicXml(text, pick);
      }
      if (i < 0) M.parts.push({name: r.name, group: defaultPartGroup(), meter: r.meter, start: null, src: r.notation, note: [], line: 0});
      else { M.parts[i].meter = r.meter; M.parts[i].src = r.notation; }
      edited(true);
      if (r.warnings.length) notice('読み込みました。\n' + r.warnings.map(w => '・' + w).join('\n'));
    } catch (e) { notice('MusicXML を読み込めません: ' + e.message); }
  };
  f.click();
}

$('playset').onclick = () => {
  if (!R) return;
  stopPlay(); playT = null;
  const D = R.data, k = curSet, s = D.sets[k];
  if (k === 0 || !s.counts) return;
  const dur = s.counts * 60 / (s.tempo || D.tempo) * 1000, t0 = performance.now();
  const step = now => {
    const c = Math.min(s.counts, (now - t0) / dur * s.counts);
    const sts = s.pos.map((_, i) => jkState(D, i, s.start + c));
    drawCanvas({pos: sts.map(x => x.p), face: sts.map(jkFacing)});
    $('info').textContent = `セット ${s.name} へ移動中 ${Math.min(s.counts, Math.floor(c) + 1)}/${s.counts}`;
    if (c < s.counts) requestAnimationFrame(step); else drawCanvas();
  };
  requestAnimationFrame(step);
};

  m.style.top = Math.max(4, Math.min(innerHeight - m.offsetHeight - 4, y)) + 'px';

function ctxHasIndividual() {

}, true);

// ---- ブラウザ版: 開く・新規・ドロップ ----
function showName(name) { $('fname').textContent = name; document.title = `${name} — 陣形エディタ`; }
async function adoptLocal(text, name, handle) {
  clearEditTimers();
  JK_LOCAL.setFile(name, handle); showName(name);
  undoStack = []; redoStack = []; sel.clear(); stopPlay(); playT = null;
  M = R = lastErr = null; fieldKey = '';
  curSet = 0; curStmt = -1;
  svg.replaceChildren();
  ['pset', 'pshow', 'psec', 'pscore', 'pwarn', 'tltrack'].forEach(id => $(id).replaceChildren());
  $('code').value = text;
  savedSrc = text; dirty = false;
  await compile(text, true);
  if (!R) showTab('pcode');
}
async function loadLocal(text, name, handle) {
  if (saving) return;
  if (!JK_PROJECT.checkpoint() && !(await ask('現在の下書きを退避できません。切り替えますか？', '切り替える'))) return;
  JK_PROJECT.replace(name, text);
  await adoptLocal(text, name, handle);
}
if (window.JK_LOCAL) {
  $('localbtns').style.display = '';
  $('projectstate').hidden = false;
  $('save').textContent = '.jk を保存';
  $('openfile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (f) loadLocal(await f.text(), f.name, null);
  };
  $('open').onclick = async () => {
    if (!window.showOpenFilePicker) { $('openfile').click(); return; }
    try {
      const [h] = await window.showOpenFilePicker({types: [{description: '陣形ファイル', accept: {'text/plain': ['.jk']}}]});
      loadLocal(await (await h.getFile()).text(), h.name, h);
    } catch (e) { if (e.name !== 'AbortError') notice('開けませんでした: ' + e.message); }
  };
  $('newfile').onclick = () => loadLocal(JK_LOCAL.template, '新しいショー.jk', null);
  window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', async e => {
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    if (!/\.jk$/i.test(f.name)) { notice('.jk ファイルをドロップしてください'); return; }
    loadLocal(await f.text(), f.name, null);
  });
}

// ---- 起動 ----
renderTools();
(async () => {
  const r = await fetch('/api/source').then(r => r.json());
  if (window.JK_PROJECT) {
    JK_PROJECT.start(r.name, r.source, (name, source, handle) => adoptLocal(source, name, handle));
    await adoptLocal(r.source, r.name, null);
    JK_PROJECT.bind({
      local: $('draftstatus'), cloud: $('syncstatus'), sync: $('projectsync'), dialog: $('syncdialog'),
      historyButton: $('drafthistory'), history: $('historydialog'),
      canReplace: manual => !busy() && !saving && !modalKey && (manual ||
        (!document.querySelector('dialog[open]') && !document.activeElement?.matches('input, textarea, select'))),
    });
    return;
  }
  showName(r.name);
  savedSrc = r.source;
  await compile(r.source, true);
  if (!R) showTab('pcode');
})();
