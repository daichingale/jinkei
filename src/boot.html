<div id="jkboot" role="status" aria-live="polite"><div class="bx">
<svg viewBox="0 0 96 96" aria-hidden="true"><rect x="4" y="4" width="88" height="88" rx="22" fill="#1c2230" stroke="#3a4152" stroke-width="2"/><g fill="#5b8def"><circle cx="26" cy="64" r="5"/><circle cx="40" cy="64" r="5"/><circle cx="54" cy="64" r="5"/><circle cx="68" cy="64" r="5"/></g><g fill="#ffd23f"><circle cx="33" cy="46" r="5"/><circle cx="47" cy="46" r="5"/><circle cx="61" cy="46" r="5"/></g><g fill="#ff6b6b"><circle cx="48" cy="28" r="5"/></g><path d="M48 33v8M33 51v8M61 51v8" stroke="#8fb3ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 4" opacity=".8"/></svg>
<h1>陣形エディタ</h1>
<div class="bar"><i id="jkbar"></i></div>
<p id="jkbt">画面を準備しています…</p>
</div></div>
<script>
window.jkBoot=(function(){var bar=document.getElementById('jkbar'),tx=document.getElementById('jkbt'),root=document.getElementById('jkboot'),cur=.06,gone=false;
function f(p,t){if(gone)return;if(p>cur){cur=p;bar.style.width=Math.round(p*100)+'%';}if(t)tx.textContent=t;}
f.done=function(){if(gone)return;gone=true;bar.style.width='100%';root.classList.add('out');setTimeout(function(){if(root.parentNode)root.parentNode.removeChild(root);},450);};
f.fail=function(m){if(gone)return;tx.innerHTML='読み込めませんでした。'+(m?'<br><span class="sub">'+String(m).replace(/</g,'&lt;')+'</span>':'')+'<br><button onclick="location.reload()">もう一度読み込む</button>';};
addEventListener('error',function(e){if(!gone&&cur<.9&&e&&e.message&&!/ResizeObserver/.test(e.message))f.fail(e.message);});
return f;})();
jkBoot(.1,'画面を準備しています…');
</script>
