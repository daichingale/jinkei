<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><base href="./"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スネアライン — 陣形</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#2c3038;--fg:#e8e9ec;--mut:#9aa0aa;--acc:#ffd23f;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
header{display:flex;align-items:baseline;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0}
header .meta{color:var(--mut);font-size:12px}
main{display:grid;grid-template-columns:1fr 440px;grid-template-rows:100%;height:calc(100vh - 50px)}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#svgwrap{flex:1;min-height:0;position:relative}
#svg{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px)}
#glwrap{flex:1;min-height:0;position:relative;display:none}
#glwrap canvas{display:block;position:absolute;inset:0;cursor:grab}
#mode3d{background:#2b3a55;border-color:#4a6390}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
button,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--mut)}
#slider{flex:1;min-width:160px;accent-color:var(--acc)}
#now{font-variant-numeric:tabular-nums;min-width:250px}
#now b{color:var(--acc)}
label{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:4px}
aside{border-left:1px solid var(--line);overflow:auto;background:var(--panel)}
aside section{padding:12px 14px;border-bottom:1px solid var(--line)}
aside h2{font-size:12px;color:var(--mut);margin:0 0 8px;font-weight:600;letter-spacing:.04em}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{padding:4px 5px;white-space:normal;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;white-space:nowrap}
tr.cur td{background:#2a2e36}
.sets td:first-child{font-weight:600}
.sets tr{cursor:pointer}
.warn{font-size:12px;padding:5px 7px;border-radius:5px;margin-bottom:4px;background:#2a1f22;cursor:pointer;border-left:3px solid var(--bad)}
.warn:hover{background:#3a2629}
.warn .k{color:var(--bad);font-weight:700;margin-right:4px}
.ok{color:#6fdc8c;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#print{display:none}
@media (max-width:850px){
  header{padding:8px 12px;flex-wrap:wrap;gap:4px 12px}
  main{display:flex;flex-direction:column;height:auto;min-height:calc(100dvh - 46px)}
  #stage{height:calc(100dvh - 46px);min-height:560px;max-height:1000px}
  #svgwrap,#glwrap{min-height:0;flex:1}
  .bar{gap:5px;padding:7px 9px}
  .bar button,.bar select{padding:5px 7px;font-size:12px}
  #slider{min-width:80px}
  #now{min-width:0;font-size:11px}
  #reelcontrols{font-size:11px}
  aside{border-left:none;border-top:1px solid var(--line);overflow:visible}
}
@media (max-width:700px),(pointer:coarse) and (max-height:500px){
  body{font-size:15px}
  header{padding:8px 12px;flex-wrap:wrap;gap:2px 10px;padding-top:max(8px,env(safe-area-inset-top))}
  header h1{font-size:16px}
  main{display:block;height:auto}
  #stage{height:calc(100dvh - 44px);min-height:420px;position:relative}
  .bar{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:8px;position:relative}
  .bar button,.bar select{min-height:44px;padding:6px 12px;font-size:16px}
  #play{order:-5;flex:1 1 34%;font-size:17px;font-weight:700;background:#2b3a55;border-color:#4a6390}
  #prev,#next{min-width:48px;order:-4}
  #mode3d{min-width:48px;order:-3;flex:none}
  #speed{order:-2}
  #slider{order:-1;flex:1 1 100%;min-width:0;height:36px;margin:0}
  #now{order:0;min-width:0;font-size:12px;flex:1 1 100%}
  .bar select.only3d,#rec{order:1;flex:1 1 44%;font-size:14px;min-height:42px}
  .bar label{font-size:13px;min-height:40px}
  .bar input[type=checkbox]{width:22px;height:22px}
  #reelcontrols{font-size:12px}
  aside{border-left:none;border-top:1px solid var(--line);overflow:visible}
  aside section{padding:12px}
  td,th{padding:8px 6px}
  .sets tr{height:44px}
  #who,#partsel,#printall{min-height:44px;font-size:16px}
}
@media print{
  body{background:#fff;color:#000}
  header,main{display:none}
  #print{display:block}
  .sheet{page-break-after:always;padding:8mm}
  .sheet table{font-size:10pt}
  .sheet td,.sheet th{border-bottom:1px solid #bbb;color:#000}
  .sheet h3{margin:0 0 4mm;font-size:14pt}
}
</style></head><body>
<header><h1 id="title"></h1><span class="meta" id="meta"></span></header>
<main>
  <div id="stage">
    <div id="svgwrap"><svg id="svg"></svg></div>
    <div id="glwrap"></div>
    <div class="bar">
      <button id="prev" title="前のセット">⏮</button>
      <button id="play">▶ 再生</button>
      <button id="next" title="次のセット">⏭</button>
      <input type="range" id="slider" min="0" step="0.01">
      <span id="now"></span>
      <select id="speed"><option value="0.5">×0.5</option><option value="1" selected>×1</option><option value="2">×2</option></select>
      <label id="sndl" style="display:none" title="パート（楽譜）の音"><input type="checkbox" id="snd" checked> 音</label>
      <label class="only2d"><input type="checkbox" id="labels"> 名前</label>
      <label class="only2d"><input type="checkbox" id="trails" checked> 移動線</label>
      <select id="cam3d" class="only3d" style="display:none" title="カメラ（ドラッグで回転・ホイールで拡大）"><option value="audience">客席から</option><option value="top">真上</option><option value="orbit">回り込み</option><option value="low">目線の高さ</option><option value="free">自由</option></select>
      <select id="look3d" class="only3d" style="display:none" title="見た目（ショーの look 指定の一時切り替え）"><option value="real">見た目: リアル</option><option value="illust">見た目: イラスト</option></select>
      <select id="layout3d" class="only3d" style="display:none" title="画面のレイアウト（縦分割 = 斜め俯瞰 / 楽譜 / 客席側 / 真上グリッドの縦長 9:16。「動画を保存」もこの形で録画）"><option value="single">レイアウト: 単一</option><option value="reel">レイアウト: 縦分割</option></select>
      <label id="reelcontrols" class="only3d" style="display:none;align-items:center;gap:6px;flex-wrap:wrap" title="縦分割の画角・俯瞰図を調整（ブラウザの録画にも反映）">
        3D拡大 <input id="reelzoom" type="range" min="0.75" max="1.5" value="1" step="0.05" style="width:92px;accent-color:var(--acc)"><output id="reelzoomvalue" for="reelzoom">100%</output>
        俯瞰 <select id="reelgridmode"><option value="all">全体固定</option><option value="follow">隊形に追従</option></select>
        ピン <select id="reelpin"><option value="1">標準</option><option value="1.25" selected>大きめ</option><option value="1.5">特大</option></select>
      </label>
      <button id="rec" class="only3d" style="display:none">● 動画を保存</button>
      <button id="mode3d">3D で見る</button>
    </div>
  </div>
  <aside>
    <section><h2>セクション</h2><div class="legend" id="legend"></div></section>
    <section id="scoresec" style="display:none"><h2>楽譜</h2><select id="partsel" style="width:100%;margin-bottom:6px"></select><div id="staff" style="overflow:hidden"></div></section>
    <section><h2>ドットシート</h2>
      <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center"><select id="who" style="flex:1;min-width:0"></select><button id="printall" style="flex:none;white-space:nowrap">全員分を印刷</button></div>
      <div id="sheet"></div></section>
    <section><h2>セット</h2><table class="sets" id="sets"></table></section>
    <section><h2>チェック</h2><div id="warns"></div></section>
  </aside>
</main>
<div id="print"></div>

<script>// 会場の2D描画（プレビューとエディタで共用）
// 座標: フィールド単位。SVG の y は下向きなので Y(y) で反転する
function jkField(svg, F) {
const FB = F.type === 'football';
let X0, X1, Y0, Y1;
if (FB) { X0 = -100; X1 = 100; Y0 = -7; Y1 = F.bsl + 5; }
else if (F.type === 'gym') { const hw = F.w/2 + F.margin, hd = F.d/2 + F.margin; X0 = -hw - 1; X1 = hw + 1; Y0 = -hd - 2.2; Y1 = hd + 2; }
else if (F.type === 'stage') { X0 = -F.w/2 - F.wing - 0.8; X1 = F.w/2 + F.wing + 0.8; Y0 = -3; Y1 = F.d + 1.8; }
else { X0 = -F.w/2 - 1.5; X1 = F.w/2 + 1.5; Y0 = -2; Y1 = F.d + 1.2; }
svg.setAttribute('viewBox', `${X0} 0 ${X1 - X0} ${Y1 - Y0}`);
const Y = y => Y1 - y;
function el(tag, attrs, parent) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }
function text(x, y, s, size, attrs, parent) { const t = el('text', Object.assign({x, y: Y(y), 'font-size': size, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: '#fff'}, attrs || {}), parent); t.textContent = s; return t; }

// ---- フィールド ----
const bg = el('g', {});
if (FB) {
  el('rect', {x: -96, y: Y(F.bsl), width: 192, height: F.bsl, fill: '#2e7d32'}, bg);
  el('rect', {x: -96, y: Y(F.bsl), width: 16, height: F.bsl, fill: '#256628'}, bg);
  el('rect', {x: 80, y: Y(F.bsl), width: 16, height: F.bsl, fill: '#256628'}, bg);
  for (let k = -10; k <= 10; k++) {
    const x = k * 8;
    el('line', {x1: x, x2: x, y1: Y(0), y2: Y(F.bsl), stroke: '#fff', 'stroke-width': k === 0 ? 0.45 : 0.25, opacity: 0.9}, bg);
    const yl = 50 - Math.abs(k) * 5;
    if (yl % 10 === 0 && yl > 0) {
      text(x, 9, String(yl), 3.4, {opacity: 0.85, 'font-weight': 700}, bg);
      text(x, F.bsl - 9, String(yl), 3.4, {opacity: 0.85, 'font-weight': 700, transform: `rotate(180 ${x} ${Y(F.bsl - 9)})`}, bg);
    }
  }
  for (let x = -80; x <= 80.001; x += 1.6) {
    for (const y of [F.hash, F.bsl - F.hash]) el('line', {x1: x, x2: x, y1: Y(y - 0.5), y2: Y(y + 0.5), stroke: '#fff', 'stroke-width': 0.18, opacity: 0.8}, bg);
    for (const y of [0.6, F.bsl - 0.6]) el('line', {x1: x, x2: x, y1: Y(y - 0.6), y2: Y(y + 0.6), stroke: '#fff', 'stroke-width': 0.18, opacity: 0.6}, bg);
  }
  const grid = el('g', {id: 'grid', opacity: 0.12}, bg);
  for (let x = -80; x <= 80; x += 4) el('line', {x1: x, x2: x, y1: Y(0), y2: Y(F.bsl), stroke: '#fff', 'stroke-width': 0.1}, grid);

// 打楽器譜を SVG 文字列にする（エディタの楽譜タブ・プレビューの楽譜・動画の楽譜ストリップで共用）。
// 音符・旗・休符・アクセント・拍子の記号は Bravura（SMuFL, SIL OFL 1.1）。フォントは src/bravura.js の Base64。
//   jkStaff(part, fromCount, toCount, width, height, playheadCount, opts) -> SVG 文字列
//     part: D.parts[i]（{meter:[n,d], start, end, bars:[], notes:[[t,dur,'R',accent,kind,pad,vel], ...]}）
//     表示範囲 [fromCount, toCount) を width×height に時間比例で並べる。playheadCount が範囲外/null なら再生位置の線は出さない。
//     opts: {fg, mu, hi, header(false で音部記号と拍子を省く), bg,
//            inst: 'line' | 'snare' | 'tenor' | 'bass' | 'cymbal'（楽器。省略時は D があれば楽器から決める。snare/cymbal/line = 1線、tenor/bass = 5線）,
//            paged(true: 縦分割レイアウト用。範囲の頭より前の音符は出さず、頭に前打音の余白をとる), noPlayhead(true で再生位置の線を省く)}
//   jkStaff.page(part, t) -> [from, to]（縦分割レイアウト用: 再生位置の小節を含む 2 小節）
//   jkStaff.geom(part, W, H, opts) -> {sp, x0, x1}（時間 → x の配置。X(t) = x0 + (t-from)/(to-from)*(x1-x0)）
//   jkStaff.instOf(D, part) -> 'snare' | 'tenor' | 'bass' | 'cymbal' | 'line'（先頭メンバーの楽器から）
//   jkStaff.labelOf(inst, part) -> 段の左に出す名前（スネア / テナー / バス / シンバル / パート名）
//   jkStaff.stack([{part, inst}, ...], W, H, t, opts) -> 複数のパートを縦に重ねた SVG（リールの帯。段の左に楽器名）
//   jkStaffFontCss() -> @font-face の CSS（SVG を単体で使うときは <style> に入れる）
//   jkStaffInstall() -> document に1回だけ @font-face を入れる
//
// 記譜の約束（README の凡例も参照）
//   スネア・シンバル・その他 = 1線。テナー = 5線の「間」に ドラム1（いちばん上の間）〜ドラム4（いちばん下の間）、
//   スポック1・2 は五線の上の加線に × 形。バス = 5線の「線」に ドラム1（上の線）〜ドラム5（下の線）、
//   ドラム番号なし（全員で同時）は5本の線すべてに重ねた和音。和音は 1 本の符幹に符頭を重ねる（隣り合う符頭は左右にずらす）。
//   奏法: x = ×の符頭 / o リムショット = 符頭に斜線 / m ミュート = 斜線 + スタッカートの点 /
//         g ゴック = ▲の符頭 / s スクレイプ = 符頭 + 波線（音符の長さぶん）/ k スティッククリック = 丸で囲んだ×（ドラムの位置に関係なく中央）
//   強弱: pp p mp mf f ff は符頭の左上に斜体の文字。cresc / dim は < > の開き線。
const jkStaff = (function () {
  'use strict';
  const G = {head: '', half: '', whole: '', cross: '', f1: '', f2: '', f3: '',
    rW: '', rH: '', rQ: '', r8: '', r16: '', r32: '', acc: '', mar: '', dot: ''};
  const digit = (d) => String.fromCharCode(0xE080 + d);
  const f2 = (v) => (Math.round(v * 100) / 100).toString();

  function install() {
    if (typeof document === 'undefined' || document.getElementById('jk-bravura')) return;
    const st = document.createElement('style');
    st.id = 'jk-bravura';
    st.textContent = fontCss();
    document.head.appendChild(st);
  }
  function fontCss() {
    return typeof JK_BRAVURA_B64 === 'undefined' ? '' : `@font-face{font-family:"Bravura";src:url(data:font/woff2;base64,${JK_BRAVURA_B64}) format("woff2")}`;
  }

  // 休符に使える長さ（カウント）と記号
  const RESTS = [[4, G.rW], [2, G.rH], [1, G.rQ], [2 / 3, G.rQ], [0.5, G.r8], [1 / 3, G.r8], [0.25, G.r16], [1 / 6, G.r16], [0.125, G.r32]];
  // JSON の数は小数3桁に丸められているので、少しゆるく比べる
  const EPS = 3e-3;
  const isPow2 = (x) => x > 0 && Math.abs(x / Math.pow(2, Math.round(Math.log2(x))) - 1) < 0.006;
  const isTrip = (d) => d > 0.01 && !isPow2(d) && isPow2(d * 3);
  const flagsOf = (d) => (d >= 1 - EPS ? 0 : d > 0.25 + EPS ? 1 : d > 0.125 + EPS ? 2 : 3);
  const dotted = (d) => [0.75, 1.5, 3, 0.375, 6].some((x) => Math.abs(d - x) < 1e-6);

  // 楽器 → 段の形。den = 段の高さが符頭の間隔 sp の何倍か、line = 中央の線の y（sp）、stem = 符幹の先（中央線から）、
  // acc = アクセント記号（中央線から）、hand = 手順の文字（中央線から）、lines = 5線か
  const CFG = {
    line: {den: 11, line: 7, stem: -3.6, acc: -5.5, mar: -5.7, hand: 3.2, pad: 3.8, five: false},
    five: {den: 13, line: 8.2, stem: -4.9, acc: -6.7, mar: -6.9, hand: 4.0, pad: 4.7, five: true},
  };
  const cfgOf = (inst) => (inst === 'tenor' || inst === 'bass' ? CFG.five : CFG.line);

  function instOf(D, part) {
    if (!D || !part || !part.members || !part.members.length || !D.performers) return 'line';
    const pf = D.performers[part.members[0]], sec = pf && D.sections && D.sections[pf.sec];
    const id = sec ? sec.instrument : '';
    if (id === 'snare') return 'snare';
    if (id === 'tenors') return 'tenor';
    if (/^bass([1-5]|_drum)$/.test(id)) return 'bass';
    if (id === 'cymbals_mid' || id === 'cymbals_high') return 'cymbal';
    return 'line';
  }
  const LABELS = {snare: 'スネア', tenor: 'テナー', bass: 'バス', cymbal: 'シンバル'};
  const labelOf = (inst, part) => LABELS[inst] || (part && part.name) || '';
  // 状態がなくても楽器を決められるように、グローバルの D（プレビューのページ）を見る
  const globalD = () => (typeof D !== 'undefined' ? D : null);
  const instFor = (part, o) => (o && o.inst) || instOf(globalD(), part);

  function geom(part, W, H, o) {
    o = o || {};
    if (part.stack && staff.stackGeomHook && !o.inStack) { const g = staff.stackGeomHook(part, W, H, o); if (g) return g; }
    const cfg = cfgOf(instFor(part, o)), sp = H / cfg.den, meter = part.meter || [4, 4];
    const x0 = o.x0 !== undefined ? o.x0 : o.header !== false ? sp * (2.6 + 1.9 * Math.max(String(meter[0]).length, String(meter[1]).length) + (o.paged ? 2.2 : 0.8)) : sp * 0.8;
    return {sp, x0, x1: W - sp * 1.2};
  }
  // 縦分割レイアウト: 再生位置を含む 2 小節
  function page(part, t) {
    const bl = Math.max(1, (part.meter || [4, 4])[0]), bars = part.bars || [];
    if (!bars.length) { const a = (part.start || 0) + Math.floor(Math.max(0, t - (part.start || 0)) / (2 * bl)) * 2 * bl; return [a, a + 2 * bl]; }
    let bi = 0;
    bars.forEach((b, i) => { if (b <= t + 1e-6) bi = i; });
    const pi = bi - bi % 2;
    return [bars[pi], pi + 2 < bars.length ? bars[pi + 2] : bars[pi] + 2 * bl];
  }

  // 1つの段の中身（<svg> で包まない）
  function body(part, from, to, W, H, ph, o) {
    const inst = instFor(part, o), cfg = cfgOf(inst), five = cfg.five;
    const fg = o.fg || '#e8e9ec', mu = o.mu || '#8a909c', hi = o.hi || '#ffd23f';
    const {sp, x0, x1} = geom(part, W, H, o);
    const lineY = cfg.line * sp, fs = 4 * sp;
    const meter = part.meter || [4, 4];
    const header = o.header !== false;
    const X = (t) => x0 + (t - from) / (to - from) * (x1 - x0);
    const out = [];
    const txt = (x, y, s, size, fill, extra, anchor) => out.push(`<text x="${f2(x)}" y="${f2(y)}" font-size="${f2(size)}" fill="${fill}" text-anchor="${anchor || 'middle'}" ${extra || ''}>${s}</text>`);
    const glyph = (x, y, ch, fill, size) => out.push(`<text x="${f2(x)}" y="${f2(y)}" font-family="Bravura" font-size="${f2(size || fs)}" fill="${fill}" text-anchor="middle">${ch}</text>`);
    const line = (x1_, y1, x2, y2, w, c) => out.push(`<line x1="${f2(x1_)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}" stroke="${c}" stroke-width="${f2(w)}"/>`);
    const poly = (pts, w, c, fill) => out.push(`<polyline points="${pts.map((p) => f2(p[0]) + ',' + f2(p[1])).join(' ')}" fill="${fill || 'none'}" stroke="${c}" stroke-width="${f2(w)}" stroke-linejoin="round"/>`);
    const halfH = five ? 2 : 0;   // 五線の半分の高さ（sp）

    // 五線 / 1線
    if (five) for (let k = -2; k <= 2; k++) out.push(`<line x1="0" y1="${f2(lineY + k * sp)}" x2="${W}" y2="${f2(lineY + k * sp)}" stroke="${fg}" stroke-width="${f2(sp * 0.12)}"/>`);
    else out.push(`<line x1="0" y1="${f2(lineY)}" x2="${W}" y2="${f2(lineY)}" stroke="${fg}" stroke-width="${f2(sp * 0.13)}"/>`);
    if (header) {
      // 打楽器記号（太い2本の縦線）と拍子
      out.push(`<rect x="${f2(sp * 0.6)}" y="${f2(lineY - sp)}" width="${f2(sp * 0.4)}" height="${f2(sp * 2)}" fill="${fg}"/>`);
      out.push(`<rect x="${f2(sp * 1.3)}" y="${f2(lineY - sp)}" width="${f2(sp * 0.4)}" height="${f2(sp * 2)}" fill="${fg}"/>`);
      const dig = (n) => String(n).split('').map((c) => digit(+c)).join('');
      const cx = sp * (2.6 + 0.95 * Math.max(String(meter[0]).length, String(meter[1]).length));
      glyph(cx, lineY - sp, dig(meter[0]), fg);
      glyph(cx, lineY + sp, dig(meter[1]), fg);
    }
    const sortedAll = (part.notes || []).map((n, ni) => ({n, ni})).sort((a, b) => a.n[0] - b.n[0] || a.ni - b.ni);
    const sorted = sortedAll.map((e) => e.n);
    const barsAll = (part.bars || []).slice();
    const barOf = (t) => { let b = part.start || 0; for (const x of barsAll) if (x <= t + EPS) b = x; return b; };
    // 小節線・終止線
    const by0 = lineY - sp * (five ? 2 : 2), by1 = lineY + sp * 2;
    for (const b of barsAll) if (b > from + 1e-6 && b < to) line(X(b), by0, X(b), by1, sp * 0.13, fg);
    if (part.end > from && part.end <= to + 1e-6) {
      line(X(part.end) - sp * 0.5, by0, X(part.end) - sp * 0.5, by1, sp * 0.13, fg);
      line(X(part.end), by0, X(part.end), by1, sp * 0.45, fg);
    }
    // 休符（音符どうしのすき間）
    const restAt = (t, len) => {
      let left = len;
      let tt = t;
      while (left > 0.1) {
        const r = RESTS.find((x) => x[0] <= left + 1e-6);
        if (!r) break;
        if (tt + r[0] > from && tt < to) glyph(X(tt + Math.min(r[0], 1) / 2), lineY, r[1], mu, fs * 0.9);
        tt += r[0]; left -= r[0];
      }
    };
    let cursor = part.start || 0;
    for (const n of sorted) { if (n[0] - cursor > 0.1) restAt(cursor, n[0] - cursor); cursor = Math.max(cursor, n[0] + n[1]); }
    if (part.end - cursor > 0.1 && sorted.length) restAt(cursor, part.end - cursor);

    // 音符 → 和音（同じ時刻の音を1つにまとめる）。ドラムの位置は楽器ごと
    const yOf = (pad, ni) => {
      if (inst === 'tenor') {
        const p = pad === 0 ? (ni % 4) + 1 : Math.min(pad, 6);
        return p <= 4 ? lineY + (p - 2.5) * sp : lineY - (p - 2) * sp;   // 1〜4 = 上から順の間、5 = 上の加線、6 = さらに上の加線
      }
      if (inst === 'bass') return lineY + (Math.min(pad, 5) - 3) * sp;     // 1〜5 = 上の線から下の線
      return lineY;
    };
    const items = [];
    for (const {n, ni} of sortedAll) {
      if ((o.paged ? n[0] < from - 1e-6 : n[0] + n[1] < from - 1e-6) || n[0] > to) continue;
      const last = items[items.length - 1];
      const head = {pad: n[5] || 0, hand: n[2], acc: n[3], ni};
      if (last && Math.abs(last.t - n[0]) < 1e-6) { last.heads.push(head); last.acc = Math.max(last.acc, n[3]); continue; }
      const d = n[1];
      items.push({t: n[0], d, acc: n[3], kind: n[4], vel: n.length > 6 ? n[6] : 0.7, heads: [head], x: X(n[0]), f: d >= 2 - 1e-6 ? 0 : flagsOf(d), stem: d < 4 - 1e-6});
    }
    // 各符頭の y と左右のずれ。バスで pad なし = 5 本の線すべて（全員で同時）
    for (const it of items) {
      let hs = it.heads;
      if (inst === 'bass') {
        const out2 = [];
        for (const h of hs) { if (h.pad === 0 && it.kind !== 'stickclick') for (let k = 1; k <= 5; k++) out2.push({...h, pad: k}); else out2.push(h); }
        hs = out2;
      }
      if (it.kind === 'stickclick') hs = [{...hs[0], pad: 0}];
      hs.forEach((h) => { h.y = it.kind === 'stickclick' ? lineY : yOf(h.pad, h.ni); });
      // 同じ y の重複は1つに
      const seen = new Set();
      hs = hs.filter((h) => { const k = f2(h.y); if (seen.has(k)) return false; seen.add(k); return true; });
      hs.sort((a, b) => b.y - a.y);   // 下から上へ
      let prev = null;
      for (const h of hs) { h.off = prev && !prev.off && Math.abs(prev.y - h.y) < sp * 1.05 ? 1 : 0; prev = h; }
      it.heads = hs;
      it.yLow = hs[0].y; it.yHigh = hs[hs.length - 1].y;
    }
    const stemTop = lineY + cfg.stem * sp;
    const hw = sp * 0.59;
    // 連桁
    const groups = [];
    let run = [];
    const flush = () => { if (run.length) groups.push(run); run = []; };
    const win = (meter[1] === 8 && meter[0] % 3 === 0) ? 3 : 1;
    items.forEach((it, i) => {
      const prev = items[i - 1];
      const gid = Math.floor((it.t - barOf(it.t)) / win + EPS);
      const ok = it.f > 0 && prev && run.length && prev.f > 0 && Math.abs(prev.t + prev.d - it.t) < EPS && prev.gid === gid;
      it.gid = gid;
      if (!ok) flush();
      if (it.f > 0) run.push(it); else flush();
    });
    flush();
    const beamed = new Set();
    const bw = sp * 0.5;
    for (const g of groups) {
      if (g.length < 2) continue;
      g.forEach((it) => beamed.add(it));
      for (let lv = 1; lv <= 3; lv++) {
        const y = stemTop + (lv - 1) * sp * 0.75 + bw / 2;
        let i = 0;
        while (i < g.length) {
          if (g[i].f < lv) { i++; continue; }
          let j = i;
          while (j + 1 < g.length && g[j + 1].f >= lv) j++;
          const xa = g[i].x + hw, xb = g[j].x + hw;
          if (j > i) line(xa - sp * 0.06, y, xb + sp * 0.06, y, bw, fg);
          else if (lv > 1) {
            // 1つだけ深い連桁は短い枝にする
            if (i < g.length - 1 || g.length < 2) line(xa, y, xa + sp * 1.3, y, bw, fg);
            else line(xa - sp * 1.3, y, xa, y, bw, fg);
          }
          i = j + 1;
        }
      }
    }
    // 3連符の数字
    const trip = new Map();
    for (const it of items) {
      if (!isTrip(it.d)) continue;
      const key = Math.floor((it.t - barOf(it.t)) / (it.d * 3) + EPS) + ':' + f2(it.d * 1000) + ':' + barOf(it.t);
      const e = trip.get(key) || {a: it.x, b: it.x};
      e.a = Math.min(e.a, it.x); e.b = Math.max(e.b, it.x);
      trip.set(key, e);
    }
    for (const e of trip.values()) txt((e.a + e.b) / 2 + hw, stemTop - sp * 0.7, '3', sp * 1.5, fg, 'font-style="italic" font-family="serif"');

    // 強弱（pp p mp mf f ff）と cresc / dim の開き線
    const DYN = [[0.25, 'pp'], [0.4, 'p'], [0.55, 'mp'], [0.7, 'mf'], [0.85, 'f'], [1.0, 'ff']];
    const dynName = (v) => { const e = DYN.find((d) => Math.abs(d[0] - v) < 0.0015); return e ? e[1] : null; };
    const dynY = lineY + cfg.acc * sp;
    const dir = (a, b) => (b.vel - a.vel > 0.0015 ? 1 : b.vel - a.vel < -0.0015 ? -1 : 0);
    // 続けて強く（弱く）なる 3 音以上の区間を探す: runs = [開始, 終了, 向き]。区間の途中の音には強弱の文字を出さない
    const runs = [];
    for (let i = 0; i < items.length - 1;) {
      const d0 = dir(items[i], items[i + 1]);
      if (d0 === 0) { i++; continue; }
      let j = i + 1;
      while (items[j + 1] && dir(items[j], items[j + 1]) === d0) j++;
      if (j - i >= 2) runs.push([i, j, d0]);
      i = j;
    }
    items.forEach((it, i) => {
      const prev = items[i - 1];
      const nm = dynName(it.vel);
      const changed = i === 0 ? Math.abs(it.vel - 0.7) > 0.0015 : Math.abs(it.vel - prev.vel) > 0.0015;
      const mid = runs.some((r) => i > r[0] && i < r[1]);
      if (nm && (changed || runs.some((r) => r[0] === i)) && !mid && !(i === 0 && !changed)) txt(it.x - sp * 0.9, dynY + sp * 0.6, nm, sp * 1.9, fg, 'font-style="italic" font-weight="700" font-family="serif"', 'end');
    });
    for (const r of runs) {
      const xa = items[r[0]].x + sp * 0.4, xb = items[r[1]].x + sp * 0.2, y = dynY - sp * 1.0, hh = sp * 0.5;
      if (r[2] > 0) { line(xa, y, xb, y - hh, sp * 0.12, fg); line(xa, y, xb, y + hh, sp * 0.12, fg); }
      else { line(xa, y - hh, xb, y, sp * 0.12, fg); line(xa, y + hh, xb, y, sp * 0.12, fg); }
    }

    for (const it of items) {
      const x = it.x, loud = it.acc > 0, k = it.kind;
      const xs = x + hw;    // 符幹の x
      const wholeLike = it.d >= 4 - 1e-6, halfLike = it.d >= 2 - 1e-6;
      // 加線（五線の外の符頭）
      if (five) {
        for (const h of it.heads) {
          if (h.y < lineY - 2 * sp - 1e-6) for (let ly = lineY - 3 * sp; ly >= h.y - 1e-6; ly -= sp) line(x - sp * 1.0, ly, x + sp * 1.0, ly, sp * 0.12, fg);
        }
      }
      for (const h of it.heads) {
        const hx = x + (h.off ? 2 * hw : 0), hy = h.y;
        const spock = inst === 'tenor' && (h.pad === 5 || h.pad === 6);
        if (k === 'stickclick') {
          glyph(hx, hy, G.cross, fg);
          out.push(`<circle cx="${f2(hx)}" cy="${f2(hy)}" r="${f2(sp * 0.95)}" fill="none" stroke="${fg}" stroke-width="${f2(sp * 0.13)}"/>`);
        } else if (k === 'gock') {
          const pts = [[hx, hy - sp * 0.62], [hx - sp * 0.7, hy + sp * 0.5], [hx + sp * 0.7, hy + sp * 0.5]];
          if (halfLike) poly([...pts, pts[0]], sp * 0.15, fg, 'none'); else poly([...pts, pts[0]], sp * 0.05, fg, fg);
        } else {
          const cross = k === 'click' || spock || inst === 'cymbal';
          glyph(hx, hy, cross ? G.cross : wholeLike ? G.whole : halfLike ? G.half : G.head, fg);
          if (k === 'rimshot' || k === 'mute') {
            // 斜線（符頭の両端から出る）
            line(hx - sp * 0.95, hy + sp * 0.95, hx - sp * 0.5, hy + sp * 0.5, sp * 0.15, fg);
            line(hx + sp * 0.5, hy - sp * 0.5, hx + sp * 0.95, hy - sp * 0.95, sp * 0.15, fg);
          }
          if (k === 'mute') out.push(`<circle cx="${f2(hx)}" cy="${f2(hy - sp * 1.25)}" r="${f2(sp * 0.2)}" fill="${fg}"/>`);
        }
        // 付点（間にある符頭はその間に、線・加線の上の符頭は上の間に）
        if (dotted(it.d)) glyph(hx + sp * 1.2 + (h.off ? 0 : 0), hy + (inst === 'tenor' && h.pad >= 1 && h.pad <= 4 ? 0.1 : -0.5) * sp, G.dot, fg);
      }
      if (it.stem) {
        line(xs, it.yLow - sp * 0.1, xs, stemTop, sp * 0.13, fg);
        if (it.f > 0 && !beamed.has(it)) glyph(xs + sp * 0.07, stemTop, it.f === 1 ? G.f1 : it.f === 2 ? G.f2 : G.f3, fg);
      }
      // スクレイプ（波線）
      if (k === 'scrape') {
        const xa = x + sp * 1.3, xb = Math.max(X(it.t + it.d) - sp * 0.3, xa + sp * 2.4), y = it.yLow;
        const pts = [];
        for (let px = xa; px <= xb; px += sp * 0.2) pts.push([px, y + Math.sin((px - xa) / (sp * 0.45) * Math.PI) * sp * 0.28]);
        poly(pts, sp * 0.13, fg);
      }
      // 装飾: フラム（小さな前打音）・ダブル・バズ（幹の斜線）
      if (k === 'flam') {
        const gx = x - sp * 1.9, gy = it.yHigh;
        glyph(gx, gy, G.head, fg, fs * 0.65);
        line(gx + hw * 0.65, gy - sp * 0.1, gx + hw * 0.65, gy - sp * 2.4, sp * 0.1, fg);
        line(gx - sp * 0.1, gy - sp * 1.9, gx + sp * 0.9, gy - sp * 2.5, sp * 0.1, fg);
      }
      if ((k === 'diddle' || k === 'buzz') && it.stem) {
        const n = k === 'buzz' ? 3 : 2;
        for (let q = 0; q < n; q++) {
          const y = stemTop + sp * (1.2 + q * 0.55);
          line(xs - sp * 0.6, y + sp * 0.35, xs + sp * 0.6, y - sp * 0.35, sp * 0.16, fg);

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const F = D.field, FB = F.type === 'football';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const $ = id => document.getElementById(id);
const FLD = jkField(svg, F);
const Y = FLD.Y, el = FLD.el, text = FLD.text;
// ---- 演者 ----
const R = FB ? 0.95 : 0.34, FS = FB ? 1.5 : 0.45;
const trailG = el('g', {});
const pathG = el('g', {});
const dotG = el('g', {});
const dots = D.performers.map((p, i) => {
  const g = el('g', {style: 'cursor:pointer'}, dotG);
  const c = el('circle', {r: R, fill: D.sections[p.sec].color, stroke: '#000', 'stroke-width': FB ? 0.18 : 0.05}, g);
  const f = el('line', {stroke: '#000', 'stroke-width': R * 0.32, 'stroke-linecap': 'round', opacity: 0.75}, g);
  const t = el('text', {'font-size': FS, 'text-anchor': 'middle', fill: '#fff', stroke: '#000', 'stroke-width': FB ? 0.25 : 0.07, 'paint-order': 'stroke', display: 'none'}, g);
  t.textContent = p.id;
  g.addEventListener('click', () => select(i));
  return {g, c, t, f};
});

let t = 0, playing = false, sel = -1, flagged = [];
const total = D.total;
$('slider').max = total;

function setAt(tt) { return jkSetAt(D, tt); }
function posAt(i, tt) { return jkState(D, i, tt).p; }

function draw() {
  const k = setAt(t), s = D.sets[k];
  for (let i = 0; i < dots.length; i++) {
    const st = jkState(D, i, t), [x, y] = st.p, fa = jkFacing(st) * Math.PI / 180;
    dots[i].c.setAttribute('cx', x); dots[i].c.setAttribute('cy', Y(y));
    dots[i].f.setAttribute('x1', x); dots[i].f.setAttribute('y1', Y(y)); dots[i].f.setAttribute('x2', x + Math.cos(fa) * R * 1.05); dots[i].f.setAttribute('y2', Y(y + Math.sin(fa) * R * 1.05));
    dots[i].t.setAttribute('x', x); dots[i].t.setAttribute('y', Y(y) - R - FS * 0.4);
    const hl = i === sel || flagged.includes(i);
    dots[i].c.setAttribute('stroke', hl ? (flagged.includes(i) ? '#ff6b6b' : '#ffd23f') : '#000');
    dots[i].c.setAttribute('stroke-width', hl ? (FB ? 0.5 : 0.12) : (FB ? 0.18 : 0.05));
  }
  // 移動線（現在の移動の始点→終点）
  trailG.innerHTML = '';
  if ($('trails').checked && k > 0 && s.counts > 0) {
    const a = D.sets[k-1].pos, b = s.pos;
    for (let i = 0; i < a.length; i++) {
      const rt = s.route && s.route[i];
      if (!rt && a[i][0] === b[i][0] && a[i][1] === b[i][1]) continue;
      const bd = s.bend ? s.bend[i] : 0, pts = [];
      if (rt) rt.forEach(q => pts.push(`${q[0]},${Y(q[1])}`));
      else for (let j = 0; j <= (bd ? 16 : 1); j++) { const q = jkArc(a[i], b[i], bd, j / (bd ? 16 : 1)); pts.push(`${q[0]},${Y(q[1])}`); }

    }
  }
  const into = t - s.start;
  let phase;
  if (k === 0) phase = s.hold > 0 ? `ホールド ${Math.min(s.hold, Math.floor(t) + 1)}/${s.hold}` : '開始位置';
  else if (into < s.counts - 1e-9) phase = `移動 ${Math.min(s.counts, Math.floor(into) + 1)}/${s.counts}`;
  else phase = s.hold > 0 ? `ホールド ${Math.min(s.hold, Math.floor(into - s.counts) + 1)}/${s.hold}` : '到着';
  $('now').innerHTML = `セット <b>${s.name}</b>　${phase}${s.mark && /ホールド/.test(phase) ? '（マークタイム）' : ''}　<span style="color:#9aa0aa">通算 ${Math.floor(t)} / ${total}・♩=${s.tempo}</span>`;

  if (window.onDraw) window.onDraw();
}

let last = null;
function loop(ts) {
  if (!playing) { last = null; return; }
  if (last !== null) t = Math.min(total, t + (ts - last) / 1000 * jkTempoAt(D, t) / 60 * +$('speed').value);
  last = ts;
  draw();
  if (t >= total) { playing = false; $('play').textContent = '▶ 再生'; window.dispatchEvent(new Event('jinkei-end')); return; }
  requestAnimationFrame(loop);
}
$('play').onclick = () => { try { jkAudio.unlock(); } catch (e) {} if (t >= total) t = 0; playing = !playing; $('play').textContent = playing ? '⏸ 停止' : '▶ 再生'; if (playing) requestAnimationFrame(loop); audioSync(); };
$('slider').oninput = e => { t = +e.target.value; draw(); audioSync(); };
const arrive = k => D.sets[k].start + D.sets[k].counts;
$('next').onclick = () => { for (let k = 0; k < D.sets.length; k++) if (arrive(k) > t + 1e-6) { t = arrive(k); break; } draw(); audioSync(); };
$('prev').onclick = () => { for (let k = D.sets.length - 1; k >= 0; k--) if (arrive(k) < t - 1e-6) { t = arrive(k); draw(); audioSync(); return; } t = 0; draw(); audioSync(); };
$('labels').onchange = e => dots.forEach(d => d.t.setAttribute('display', e.target.checked ? 'inline' : 'none'));
$('trails').onchange = draw;
document.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.code === 'Space') { e.preventDefault(); $('play').click(); } if (e.code === 'ArrowRight') $('next').click(); if (e.code === 'ArrowLeft') $('prev').click(); });

// ---- 楽譜と音（パートがあるときだけ） ----
// 楽器の違うパートが 2 つ以上あるときは、段を重ねた楽譜の「全パート」を末尾に足す（楽譜を持たない見せかけのパート。縦分割レイアウトの帯とここの楽譜が使う）
{
  const idx = jkReel.pickParts(D);
  if (idx.length >= 2) {
    const q = D.parts[idx[0]];
    D.parts.push({name: D.name, members: [], meter: q.meter, start: Math.min(...idx.map(i => D.parts[i].start)), end: Math.max(...idx.map(i => D.parts[i].end)), bars: q.bars, notes: [], stack: idx});
  }
}
const hasParts = !!(D.parts && D.parts.some(p => p.notes.length));
// 描画側（3D など）から使う入口: window.jkAudioSync() = 今の再生状態に合わせて音を鳴らし直す/止める
function audioSync() {
  if (!hasParts) return;
  if (playing && $('snd').checked) jkAudio.play(D, t, +$('speed').value); else jkAudio.stop();
}
window.jkAudioSync = audioSync;
if (hasParts) {
  $('sndl').style.display = ''; $('scoresec').style.display = '';
  $('snd').onchange = audioSync;
  $('speed').addEventListener('change', audioSync);
  const partName = (p) => p.stack ? `全パートを重ねる（${p.stack.map(i => jkStaff.labelOf(jkStaff.instOf(D, D.parts[i]), D.parts[i])).join(' / ')}）` : `${p.name.replace(/&/g, '&amp;').replace(/</g, '&lt;')}（${p.members.length}人）`;
  $('partsel').innerHTML = D.parts.map((p, i) => `<option value="${i}">${partName(p)}</option>`).join('');
  const stackAt = D.parts.findIndex(p => p.stack);
  $('partsel').value = stackAt >= 0 ? stackAt : D.parts.reduce((b, p, i) => p.members.length > D.parts[b].members.length ? i : b, 0);   // 重ね表示があればそれ、なければ人数が最も多いパートを初期表示（縦分割レイアウトの楽譜にも使う）
  $('partsel').onchange = () => { draw(); window.dispatchEvent(new Event('resize')); };   // 段数が変わると楽譜の帯の高さも変わる
  window.updateStaff = () => {
    const p = D.parts[+$('partsel').value || 0], w = $('staff').clientWidth || 400;
    $('staff').innerHTML = p.stack ? jkStaff.stack(p.stack.map(i => ({part: D.parts[i], inst: jkStaff.instOf(D, D.parts[i])})), w, 96 * p.stack.length, t, {paged: true, header: true}) : jkStaff(p, t - 1.5, t + 4.5, w, 96, t);
  };
}
window.addEventListener('jinkei-end', () => jkAudio.stop());

// ---- サイドパネル ----
$('title').textContent = D.name;
$('meta').textContent = `${D.performers.length}人 ・ ${D.sets.length}セット ・ ${total}カウント ・ ♩=${D.tempo} ・ ${({football: 'フットボールフィールド（' + F.level + '）', gym: '体育館 演技フロア ' + F.w + '×' + F.d + 'm', stage: 'ステージ 間口' + F.w + 'm×奥行' + F.d + 'm・袖' + F.wing + 'm', floor: 'フロア ' + F.w + '×' + F.d + 'm'})[F.type]}`;
$('legend').innerHTML = D.sections.map(s => `<span><i style="background:${s.color}"></i>${s.label}（${D.performers.filter(p => D.sections[p.sec].id === s.id).length}）</span>`).join('');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
$('sets').innerHTML = '<tr><th>セット</th><th>カウント</th><th>最大歩幅</th><th></th></tr>' + D.sets.map((s, k) => {
  const n = D.warnings.filter(w => w.set === k).length;
  return `<tr data-k="${k}"><td>${esc(s.name)}</td><td>${k ? s.counts : '—'}${s.hold ? ' +' + s.hold : ''}</td><td>${esc(s.max_step)}${s.min_counts && s.min_counts > s.counts ? '<br><span style="color:#ff6b6b;font-size:11px">最低' + s.min_counts + 'カウント必要</span>' : ''}</td><td>${n ? '<span style="color:#ff6b6b">⚠' + n + '</span>' : ''}</td></tr>`;
}).join('');
document.querySelectorAll('#sets tr[data-k]').forEach(tr => tr.onclick = () => { t = arrive(+tr.dataset.k); flagged = []; draw(); audioSync(); });
$('warns').innerHTML = D.warnings.length ? D.warnings.map((w, j) => `<div class="warn" data-j="${j}"><span class="k">${w.kind}</span>${esc(w.msg)}</div>`).join('') : '<div class="ok">✓ 大股・衝突・場外はありません</div>';
document.querySelectorAll('.warn').forEach(d => d.onclick = () => { const w = D.warnings[+d.dataset.j]; t = w.at; flagged = w.who; playing = false; $('play').textContent = '▶ 再生'; draw(); audioSync(); });

$('who').innerHTML = '<option value="-1">メンバーを選択（ドットをクリックでも可）</option>' + D.performers.map((p, i) => `<option value="${i}">${p.id}（${D.sections[p.sec].label}）</option>`).join('');
$('who').onchange = e => select(+e.target.value);
function sheetTable(i) {
  return '<table><tr><th>セット</th><th>カウント</th><th>左右</th><th>前後</th><th>向き</th><th>歩幅</th></tr>' + D.dots[i].map((d, k) => `<tr><td>${esc(D.sets[k].name)}</td><td>${k ? D.sets[k].counts : '—'}</td><td>${esc(d.h)}</td><td>${esc(d.v)}</td><td>${esc(d.face)}</td><td>${esc(d.step)}</td></tr>`).join('') + '</table>';
}
function select(i) {
  sel = i; $('who').value = i; flagged = [];
  pathG.innerHTML = '';
  if (i >= 0) {
    $('sheet').innerHTML = sheetTable(i);
    const pts = D.sets.map(s => s.pos[i]);
    el('polyline', {points: pts.map(p => `${p[0]},${Y(p[1])}`).join(' '), fill: 'none', stroke: '#ffd23f', 'stroke-width': FB ? 0.3 : 0.08, 'stroke-dasharray': FB ? '1 0.6' : '0.25 0.15'}, pathG);
    pts.forEach((p, k) => text(p[0], p[1] + R * 1.7, D.sets[k].name, FS * 0.85, {fill: '#ffd23f', stroke: '#000', 'stroke-width': FB ? 0.2 : 0.05, 'paint-order': 'stroke'}, pathG));
  } else $('sheet').innerHTML = '';
  draw();
}
$('printall').onclick = () => {
  $('print').innerHTML = D.performers.map((p, i) => `<div class="sheet"><h3>${esc(p.id)}（${esc(D.sections[p.sec].label)}） — ${esc(D.name)}</h3>${sheetTable(i)}</div>`).join('');
  window.print();
};
// URL の #t=40&p=tp1 で時刻・メンバーを指定して開ける
(() => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('t')) t = Math.min(total, +h.get('t') || 0);
  if (h.has('labels')) { $('labels').checked = true; $('labels').onchange({target: $('labels')}); }
  const pi = D.performers.findIndex(p => p.id === h.get('p'));
  if (pi >= 0) select(pi);
})();
draw();
</script>
<script>
(function () {
  var btn = document.getElementById('mode3d'); btn.disabled = true;
  function sc(src) { return new Promise(function (ok, ng) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ng; document.head.appendChild(s); }); }
  var human = fetch('assets/human.bin.gz').then(function (r) {
    if (!r.ok) throw new Error('human'); if (!window.DecompressionStream) throw new Error('DecompressionStream');
    return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  });
  Promise.all([sc('assets/three.min.js'), human]).then(function (r) { window.JK_HUMAN_BIN = new Uint8Array(r[1]); btn.disabled = false; return sc('assets/view3d.js'); })
    .catch(function (e) { btn.textContent = '3D は使えません'; btn.title = String(e && e.message || e); });
})();
</script>
</body></html>
